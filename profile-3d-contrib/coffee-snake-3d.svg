    <!-- 3D Snake Crawling across the Coffee Beans Grid -->
    <g>
      <!-- Snake Tail & Body -->
      <rect x="-140" y="-80" width="22" height="22" rx="6" fill="#e2b98d" opacity="0.95"/>
      <rect x="-140" y="-20" width="22" height="22" rx="6" fill="#d4a373" opacity="0.95"/>
      <rect x="-80" y="-20" width="22" height="22" rx="6" fill="#b67b57" opacity="0.95"/>
      <rect x="-20" y="-20" width="22" height="22" rx="6" fill="#84563c" opacity="0.95"/>
      <!-- Snake Head Eating peak coffee bean -->
      <g class="snake-head">
        <rect x="-20" y="40" width="24" height="24" rx="8" fill="#d4a373"/>
        <circle cx="-12" cy="46" r="3" fill="#14141e"/>
        <circle cx="-12" cy="58" r="3" fill="#14141e"/>
        <!-- Tongue -->
        <path d="M-4,52 L4,52 L8,48 M4,52 L8,56" stroke="#e63946" stroke-width="2" fill="none"/>
      </g>
    </g>

