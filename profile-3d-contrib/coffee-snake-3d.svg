      <path d="M-15,-15 L15,-15 L15,15 L-15,15 Z" fill="#84563c" rx="4"/>
      <ellipse cx="0" cy="0" rx="12" ry="9" fill="#a46d4d"/>
      <path d="M-4,-7 Q0,0 -4,7" stroke="#523624" stroke-width="1.5" fill="none"/>
