      <ellipse cx="0" cy="0" rx="12" ry="9" fill="#a46d4d"/>
      <path d="M-4,-7 Q0,0 -4,7" stroke="#523624" stroke-width="1.5" fill="none"/>
    </g>
    <g transform="translate(-140, -80)">
      <path d="M-15,-15 L15,-15 L15,15 L-15,15 Z" fill="#d4a373" rx="4"/>
      <ellipse cx="0" cy="0" rx="12" ry="9" fill="#e2b98d"/>
      <path d="M-4,-7 Q0,0 -4,7" stroke="#966840" stroke-width="1.5" fill="none"/>
    </g>
    <g transform="translate(-80, -80)">
      <path d="M-15,-15 L15,-15 L15,15 L-15,15 Z" fill="#b67b57" rx="4"/>
      <ellipse cx="0" cy="0" rx="12" ry="9" fill="#cd916c"/>
      <path d="M-4,-7 Q0,0 -4,7" stroke="#754b32" stroke-width="1.5" fill="none"/>
