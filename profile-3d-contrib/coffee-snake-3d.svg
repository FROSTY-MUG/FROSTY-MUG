<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 340" width="850" height="340">
  <rect width="100%" height="100%" fill="#14141e" rx="12"/>
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 600; fill: #d4a373; letter-spacing: 0.5px; }
    .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #7c7c9a; }
    .bean-top { transition: all 0.3s ease; }
    @keyframes pulse {
      0% { opacity: 0.8; }
      50% { opacity: 1; filter: drop-shadow(0 0 4px #d4a373); }
      100% { opacity: 0.8; }
    }
    .snake-head { animation: pulse 2s infinite ease-in-out; }
  </style>

  <!-- Header -->
  <text x="35" y="38" class="title">3D Coffee Contribution Matrix &amp; Snake</text>
  <text x="35" y="58" class="sub">Activity grid mapped with coffee bean nodes &amp; animated 3D snake</text>

  <!-- Legend -->
  <g transform="translate(620, 35)">
    <text x="0" y="10" font-family="sans-serif" font-size="11" fill="#7c7c9a">Less</text>
    <rect x="30" y="0" width="12" height="12" rx="2" fill="#24150d"/>
    <rect x="46" y="0" width="12" height="12" rx="2" fill="#523624"/>
    <rect x="62" y="0" width="12" height="12" rx="2" fill="#84563c"/>
    <rect x="78" y="0" width="12" height="12" rx="2" fill="#b67b57"/>
    <rect x="94" y="0" width="12" height="12" rx="2" fill="#d4a373"/>
    <text x="112" y="10" font-family="sans-serif" font-size="11" fill="#7c7c9a">More</text>
  </g>

  <!-- 3D Isometric View Container -->
