      <line x1="-220" y1="-160" x2="-220" y2="160"/>
      <line x1="-160" y1="-160" x2="-160" y2="160"/>
      <line x1="-100" y1="-160" x2="-100" y2="160"/>
      <line x1="-40" y1="-160" x2="-40" y2="160"/>
      <line x1="20" y1="-160" x2="20" y2="160"/>
      <line x1="80" y1="-160" x2="80" y2="160"/>
      <line x1="140" y1="-160" x2="140" y2="160"/>
      <line x1="200" y1="-160" x2="200" y2="160"/>

      <line x1="-220" y1="-160" x2="200" y2="-160"/>
      <line x1="-220" y1="-100" x2="200" y2="-100"/>
      <line x1="-220" y1="-40" x2="200" y2="-40"/>
      <line x1="-220" y1="20" x2="200" y2="20"/>
      <line x1="-220" y1="80" x2="200" y2="80"/>
      <line x1="-220" y1="140" x2="200" y2="140"/>
