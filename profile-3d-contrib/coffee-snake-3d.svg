    <g transform="translate(40, -20)">
      <path d="M-15,-15 L15,-15 L15,15 L-15,15 Z" fill="#523624" rx="4"/>
      <ellipse cx="0" cy="0" rx="12" ry="9" fill="#6f4a32"/>
      <path d="M-4,-7 Q0,0 -4,7" stroke="#331f13" stroke-width="1.5" fill="none"/>
    </g>
