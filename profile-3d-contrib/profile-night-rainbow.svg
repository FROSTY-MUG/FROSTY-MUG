<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 280" width="850" height="280">
  <rect width="100%" height="100%" fill="#1a1b27" rx="10"/>
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 600; fill: #a855f7; }
    .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #707a9e; }
    .block { transition: transform 0.3s ease; }
    .block:hover { transform: translateY(-5px); }
  </style>

  <text x="30" y="35" class="title">🧊 3D Contribution Matrix</text>
  <text x="30" y="55" class="sub">Activity Overview &amp; Contribution Density</text>

  <!-- Isometric 3D Grid Illustration -->
  <g transform="translate(425, 160) scale(1, 0.5) rotate(45)">
    <!-- Base Grid -->
    <g opacity="0.15" stroke="#a855f7" stroke-width="1">
      <line x1="-200" y1="-200" x2="-200" y2="200"/>
      <line x1="-150" y1="-200" x2="-150" y2="200"/>
      <line x1="-100" y1="-200" x2="-100" y2="200"/>
      <line x1="-50" y1="-200" x2="-50" y2="200"/>
      <line x1="0" y1="-200" x2="0" y2="200"/>
      <line x1="50" y1="-200" x2="50" y2="200"/>
      <line x1="100" y1="-200" x2="100" y2="200"/>
      <line x1="150" y1="-200" x2="150" y2="200"/>
      <line x1="200" y1="-200" x2="200" y2="200"/>

      <line x1="-200" y1="-200" x2="200" y2="-200"/>
      <line x1="-200" y1="-150" x2="200" y2="-150"/>
      <line x1="-200" y1="-100" x2="200" y2="-100"/>
      <line x1="-200" y1="-50" x2="200" y2="-50"/>
      <line x1="-200" y1="0" x2="200" y2="0"/>
      <line x1="-200" y1="50" x2="200" y2="50"/>
      <line x1="-200" y1="100" x2="200" y2="100"/>
      <line x1="-200" y1="150" x2="200" y2="150"/>
      <line x1="-200" y1="200" x2="200" y2="200"/>
    </g>

    <!-- 3D Columns -->
    <!-- Column 1 -->
    <rect x="-180" y="-140" width="30" height="30" fill="#39d353" rx="3" opacity="0.9"/>
    <rect x="-130" y="-90" width="30" height="30" fill="#0e4429" rx="3"/>
    <rect x="-80" y="-140" width="30" height="30" fill="#26a641" rx="3"/>
    <rect x="-30" y="-40" width="30" height="30" fill="#00f0ff" rx="3"/>
    <rect x="20" y="-140" width="30" height="30" fill="#a855f7" rx="3"/>
    <rect x="70" y="-90" width="30" height="30" fill="#39d353" rx="3"/>
    <rect x="120" y="-40" width="30" height="30" fill="#00f0ff" rx="3"/>

    <!-- Column 2 -->
    <rect x="-180" y="-40" width="30" height="30" fill="#00f0ff" rx="3"/>
    <rect x="-130" y="10" width="30" height="30" fill="#a855f7" rx="3"/>
    <rect x="-80" y="-40" width="30" height="30" fill="#39d353" rx="3"/>
    <rect x="-30" y="60" width="30" height="30" fill="#0e4429" rx="3"/>
    <rect x="20" y="10" width="30" height="30" fill="#26a641" rx="3"/>
    <rect x="70" y="60" width="30" height="30" fill="#a855f7" rx="3"/>
    <rect x="120" y="110" width="30" height="30" fill="#00f0ff" rx="3"/>

    <!-- Column 3 -->
    <rect x="-180" y="60" width="30" height="30" fill="#a855f7" rx="3"/>
    <rect x="-130" y="110" width="30" height="30" fill="#39d353" rx="3"/>
    <rect x="-80" y="60" width="30" height="30" fill="#00f0ff" rx="3"/>
    <rect x="-30" y="110" width="30" height="30" fill="#26a641" rx="3"/>
    <rect x="20" y="160" width="30" height="30" fill="#39d353" rx="3"/>
    <rect x="70" y="110" width="30" height="30" fill="#a855f7" rx="3"/>
  </g>
</svg>
