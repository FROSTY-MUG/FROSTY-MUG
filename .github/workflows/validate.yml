name: Portfolio & Telemetry Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    name: Code & Integrity Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate JSON Schema & File Integrity
        run: |
          python -c '
          import json, os, sys
          data_path = "data/github-data.json"
          if not os.path.exists(data_path):
              print("data/github-data.json missing!", file=sys.stderr)
              sys.exit(1)
          with open(data_path, "r", encoding="utf-8") as f:
              d = json.load(f)
          assert "metadata" in d, "missing metadata key"
          assert "languages" in d, "missing languages key"
          assert "all_repositories" in d, "missing all_repositories key"
          print("JSON integrity passed.")
          '

      - name: Scan for Secret Leaks
        run: |
          # Ensure no personal access tokens or high-entropy credentials exist in scripts or docs
          python -c '
          import os, re, sys
          bad_patterns = [r"ghp_[a-zA-Z0-9]{36}", r"github_pat_[a-zA-Z0-9]{82}", r"sk-[a-zA-Z0-9]{48}"]
          found = False
          for root, _, files in os.walk("."):
              if ".git" in root:
                  continue
              for f in files:
                  if f.endswith((".py", ".md", ".json", ".html", ".js")):
                      path = os.path.join(root, f)
                      with open(path, "r", encoding="utf-8", errors="ignore") as content:
                          text = content.read()
                          for p in bad_patterns:
                              if re.search(p, text):
                                  print(f"Potential secret pattern {p} detected in {path}", file=sys.stderr)
                                  found = True
          if found:
              sys.exit(1)
          print("Secret hygiene validation passed.")
          '

      - name: Validate Python Scripts
        run: |
          python -m py_compile scripts/generate_github_data.py
          python -m py_compile scripts/update_readme.py
          echo "Python syntax audit passed."

      - name: Check HTML & Web Assets
        run: |
          test -f portfolio/index.html || (echo "portfolio/index.html missing" && exit 1)
          test -f portfolio/styles.css || (echo "portfolio/styles.css missing" && exit 1)
          test -f portfolio/app.js || (echo "portfolio/app.js missing" && exit 1)
          echo "Web asset structure verified."
