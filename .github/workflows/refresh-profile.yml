name: Refresh Profile Data & Telemetry

on:
  schedule:
    # Run twice daily at 00:00 and 12:00 UTC
    - cron: '0 0,12 * * *'
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/refresh-profile.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collect-and-update:
    name: Harvest Telemetry & Update README
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Harvest Public GitHub Telemetry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: 'FROSTY-MUG'
        run: |
          python scripts/generate_github_data.py

      - name: Inject Metrics into Profile README
        run: |
          python scripts/update_readme.py

      - name: Commit & Push Changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/github-data.json README.md
          if git diff --staged --quiet; then
            echo "No telemetry changes detected."
          else
            git commit -m "chore: refresh portfolio telemetry from GitHub [skip ci]"
            git push origin main
          fi
