<svg width="1200" height="280" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="50%" stop-color="#0d1424"/>
      <stop offset="100%" stop-color="#141e33"/>
    </linearGradient>

    <!-- Top Glow Line Gradient -->
    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0ea5e9" stop-opacity="1"/>
      <stop offset="75%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Radial Cyan Accent Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#0369a1" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#080c14" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
      font-weight: 800;
      font-size: 54px;
      fill: #f8fafc;
      letter-spacing: 0.08em;
    }
    .badge {
      font-family: ui-monospace, SFMono-Regular, "Fira Code", Menlo, monospace;
      font-weight: 600;
      font-size: 14px;
      fill: #38bdf8;
      letter-spacing: 0.18em;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #38bdf8;
      letter-spacing: 0.06em;
    }
    .desc {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
      font-weight: 400;
      font-size: 15px;
      fill: #94a3b8;
      letter-spacing: 0.02em;
    }
    .bracket {
      fill: #38bdf8;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-weight: 700;
    }
  </style>

  <!-- Card Frame & Background -->
  <rect x="2" y="2" width="1196" height="276" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="2" y="2" width="1196" height="276" rx="16" fill="url(#centerGlow)"/>
  <rect x="2" y="2" width="1196" height="276" rx="16" fill="url(#grid)"/>

  <!-- Top Accent Glowing Strip -->
  <rect x="40" y="2" width="1120" height="2.5" fill="url(#glowLine)"/>

  <!-- Status Badge Container -->
  <g transform="translate(470, 36)">
    <rect x="0" y="0" width="260" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="16" cy="14" r="4.5" fill="#10b981"/>
    <text x="32" y="19" class="badge">FORWARD DEPLOYED ENGINEER</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="125" text-anchor="middle" class="title">ARYAN ARORA</text>

  <!-- Subtitle with Bracket Details -->
  <text x="600" y="165" text-anchor="middle" class="subtitle">
    <tspan class="bracket">&lt; </tspan>Applied AI Systems &bull; Cryptographic Vaults &bull; High-Throughput C++<tspan class="bracket"> /&gt;</tspan>
  </text>

  <!-- Descriptive Positioning Statement -->
  <text x="600" y="202" text-anchor="middle" class="desc">
    Turning high-ambiguity domain friction into deterministic, hardened production software.
  </text>

  <!-- Bottom Details Bar -->
  <g transform="translate(600, 240)">
    <text x="0" y="0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#64748b" letter-spacing="0.1em">
      4x HACKATHON CHAMPION &bull; IIT ROORKEE FINCORTEX &bull; IEEE LOGIXCAPE &bull; KINDLE JUNIOR &bull; DIGITECH TITANS
    </text>
  </g>
</svg>
